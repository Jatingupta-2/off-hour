<svg color="#1A1918" height="100%" viewBox="0 0 200 200" width="100%" xmlns="http://www.w3.org/2000/svg">
<defs>
<style>
      @keyframes rotateMinute {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes rotateHour {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .minute-hand-group {
        transform-origin: 100px 100px;
        animation: rotateMinute 8s linear infinite;
      }
      .hour-hand-group {
        transform-origin: 100px 100px;
        animation: rotateHour 48s linear infinite;
      }
      @media (prefers-reduced-motion: reduce) {
        .minute-hand-group, .hour-hand-group {
          animation: none;
        }
      }
    </style>
</defs>
<!-- Clean background for maximum clarity and export -->
<rect fill="#FBF9F5" height="200" rx="20" width="200"></rect>
<g transform="translate(100, 100)">
<!-- Fine Outer Dial Bezel (thin 1.4px) -->
<circle cx="0" cy="0" fill="none" r="76" stroke="#1A1918" stroke-width="1.5"></circle>
<!-- Delicate cardinal dial indices (12, 3, 6, 9) -->
<line stroke="#1A1918" stroke-linecap="round" stroke-width="1.4" x1="0" x2="0" y1="-76" y2="-68"></line>
<line stroke="#1A1918" stroke-linecap="round" stroke-width="1.4" x1="76" x2="68" y1="0" y2="0"></line>
<line stroke="#1A1918" stroke-linecap="round" stroke-width="1.4" x1="0" x2="0" y1="76" y2="68"></line>
<line stroke="#1A1918" stroke-linecap="round" stroke-width="1.4" x1="-76" x2="-68" y1="0" y2="0"></line>
<!-- Fine perimeter dashed minutes track ring -->
<circle cx="0" cy="0" fill="none" r="58" stroke="#1A1918" stroke-dasharray="2 6.5" stroke-width="0.8"></circle>
</g>
<!-- ROTATING BACKGROUND WATCH HANDS (Pivot at center 100, 100) -->
<!-- Rotating Hour Hand -->
<g class="hour-hand-group" opacity="0.4">
<!-- Hour Hand needle pointing upward initially with counterweight -->
<line stroke="#1A1918" stroke-linecap="round" stroke-width="1.2" x1="100" x2="100" y1="100" y2="66"></line>
<line stroke="#1A1918" stroke-linecap="round" stroke-width="1.2" x1="100" x2="100" y1="100" y2="112"></line>
</g>
<!-- Rotating Minute Hand -->
<g class="minute-hand-group" opacity="0.4">
<!-- Minute Hand needle extending further toward track with counterweight -->
<line stroke="#1A1918" stroke-linecap="round" stroke-width="1.0" x1="100" x2="100" y1="100" y2="48"></line>
<line stroke="#1A1918" stroke-linecap="round" stroke-width="1.0" x1="100" x2="100" y1="100" y2="114"></line>
</g>
<!-- Static Center Pinion for background hands -->
<circle cx="100" cy="100" fill="none" r="2.8" stroke="#1A1918" stroke-width="0.9"></circle>
<circle cx="100" cy="100" fill="#1A1918" r="1.1"></circle>
<!-- FOREGROUND: Twin Pivot Watch Hand Assembly Forming 'H' (Static Monogram Core) -->
<g transform="translate(100, 100)">
<!-- Left Watch Hand Pillar -->
<line stroke="#1A1918" stroke-linecap="round" stroke-width="2.2" x1="-19" x2="-19" y1="-38" y2="38"></line>
<!-- Left center pinion / jewel collar -->
<circle cx="-19" cy="0" fill="#1A1918" r="3.8"></circle>
<circle cx="-19" cy="0" fill="#FBF9F5" r="1.4"></circle>
<!-- Right Watch Hand Pillar -->
<line stroke="#1A1918" stroke-linecap="round" stroke-width="2.2" x1="19" x2="19" y1="-38" y2="38"></line>
<!-- Right center pinion / jewel collar -->
<circle cx="19" cy="0" fill="#1A1918" r="3.8"></circle>
<circle cx="19" cy="0" fill="#FBF9F5" r="1.4"></circle>
<!-- Horizontal Connecting Bridge Hand linking both pivots to complete 'H' -->
<line stroke="#1A1918" stroke-width="1.9" x1="-19" x2="19" y1="0" y2="0"></line>
</g>
</svg>
